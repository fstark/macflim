name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch tags and history

    - name: Extract tag message
      id: tag_message
      run: |
        # Get tag annotation (not commit message)
        TAG_MESSAGE=$(git for-each-ref --format='%(contents)' refs/tags/${{ github.ref_name }})
        if [ -n "$TAG_MESSAGE" ]; then
          echo "HAS_MESSAGE=true" >> $GITHUB_OUTPUT
          # Escape for multiline in GitHub Actions
          {
            echo 'MESSAGE<<EOF'
            echo "$TAG_MESSAGE"
            echo EOF
          } >> $GITHUB_OUTPUT
        else
          echo "HAS_MESSAGE=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Prepare release body
      id: release_body
      run: |
        {
          echo 'BODY<<EOF'
          if [ "${{ steps.tag_message.outputs.HAS_MESSAGE }}" == "true" ]; then
            echo "## What's New"
            echo ""
            echo "${{ steps.tag_message.outputs.MESSAGE }}"
            echo ""
          fi
          echo "## Installation"
          echo ""
          echo "### Classic Mac OS"
          echo "Download the \`MacFlim-${{ github.ref_name }}-Release.dsk\` disk image below."
          echo "It countains the MacFlim application and HyperCard XCMD."
          echo ""
          echo "### macOS"
          echo "Install via Homebrew:"
          echo "\`\`\`"
          echo "brew install fstark/macflim/flimmaker"
          echo "\`\`\`"
          echo ""
          echo "This will build from source and install all dependencies automatically."
          echo ""
          echo "### Windows"
          echo "Download the \`flimmaker-windows-x86_64-${{ github.ref_name }}.zip\` file below, extract it, and run \`flimmaker.exe\`."
          echo "All required DLLs are included."
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Create Draft Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        body: ${{ steps.release_body.outputs.BODY }}
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

  create-source-tarball:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create VERSION file
      run: |
        echo "${{ github.ref_name }}" > VERSION
        echo "Created VERSION file with: ${{ github.ref_name }}"
    
    - name: Create source tarball
      run: |
        cd ..
        tar -czf macflim-${{ github.ref_name }}.tar.gz \
          --exclude=.git \
          --exclude=.github \
          macflim/
        mv macflim-${{ github.ref_name }}.tar.gz macflim/
        cd macflim
        ls -lh macflim-${{ github.ref_name }}.tar.gz
    
    - name: Upload tarball to release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: macflim-${{ github.ref_name }}.tar.gz
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

  # Temporarily disabled - macOS-13 is retired
  # test-builds:
  #   runs-on: ${{ matrix.os }}
  #   strategy:
  #     matrix:
  #       include:
  #         - os: macos-latest
  #           arch: arm64
  #         - os: macos-13
  #           arch: x86_64
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v4
  #     
  #   - name: Install dependencies
  #     run: |
  #       brew install gcc@14
  #       brew install ffmpeg
  #     
  #   - name: Test build on ${{ matrix.arch }}
  #     run: |
  #       cd src
  #       make clean
  #       make release CPP=g++-14
  #       make test

  build-windows:
    needs: create-release
    uses: ./.github/workflows/build-windows.yml
  
  build-classic-mac:
    needs: create-release
    uses: ./.github/workflows/classic-mac-os-7-build.yml
  
  attach-windows-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-windows]
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-windows.outputs.artifact-name }}
        path: flimmaker-windows/
        
    - name: Create ZIP archive
      run: |
        cd flimmaker-windows
        # Update README with version info
        echo "" >> README.txt
        echo "Version: ${{ github.ref_name }}" >> README.txt
        echo "Commit: ${{ github.sha }}" >> README.txt
        zip -r ../flimmaker-windows-x86_64-${{ github.ref_name }}.zip .
        cd ..
        ls -lh flimmaker-windows-x86_64-${{ github.ref_name }}.zip
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: ./flimmaker-windows-x86_64-${{ github.ref_name }}.zip

  attach-classic-mac-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-classic-mac]
    steps:
    - name: Download Classic Mac artifact
      uses: actions/download-artifact@v4
      with:
        name: MacFlim-${{ needs.build-classic-mac.outputs.version }}-Release
        path: classic-mac/
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: ./classic-mac/MacFlim-v${{ needs.build-classic-mac.outputs.version }}-Release.dsk
